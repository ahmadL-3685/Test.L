name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project around my files
        run: |
          mkdir -p /tmp/src
          cp main.dart pubspec.yaml /tmp/src/
          flutter create --platforms=android --project-name testino --org com.testino.app .
          cp /tmp/src/pubspec.yaml pubspec.yaml
          mkdir -p lib
          cp /tmp/src/main.dart lib/main.dart
          sed -i 's/android:label="[^"]*"/android:label="Testino"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build APK (retries if GitHub downloads fail)
        run: |
          for i in 1 2 3 4 5; do
            echo "=== Attempt $i ==="
            if flutter build apk --release; then
              exit 0
            fi
            echo "Build failed, waiting before retry..."
            sleep $((i * 30))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: testino-apk
          path: build/app/outputs/flutter-apk/app-release.apk
